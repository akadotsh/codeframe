[package]
name = "code-frame-api"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.21.0", features = ["js", "v4"] }
wasm-bindgen = "0.2.114"
worker = "0.8"
worker-macros = "0.8"

[profile.release]
codegen-units = 1
lto = true
strip = "debuginfo"
