[package]
name = "code-frame-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
uuid = { version = "1.21.0", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "1.0.149"
tower = { version = "0.5.3", features = ["util"] }
