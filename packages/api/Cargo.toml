[package]
name = "code-frame-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
